name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Testy (rdzeń, bezpieczeństwo, fuzzing, pomocnik)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Konfiguracja
        run: cmake -B build -DKETTLELAN_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Budowanie
        run: cmake --build build -j"$(nproc)"
      - name: Testy
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Testy z wykrywaniem błędów pamięci (ASan + UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Konfiguracja
        run: cmake -B build -DKETTLELAN_BUILD_APP=OFF -DKETTLELAN_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Budowanie
        run: cmake --build build -j"$(nproc)"
      - name: Testy
        run: ctest --test-dir build --output-on-failure
      - name: Długi fuzzing (5 mln prób)
        run: ./build/kettlelan_fuzz 5000000
