name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (core, security, fuzzing, helper)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # the token is not kept in .git/config
      - name: Configure
        run: cmake -B build -DKETTLELAN_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Tests with memory error detection (ASan + UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # the token is not kept in .git/config
      - name: Configure
        run: cmake -B build -DKETTLELAN_BUILD_APP=OFF -DKETTLELAN_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Long fuzzing (5 million inputs)
        run: ./build/kettlelan_fuzz 5000000

  windows:
    name: Tests on Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # the token is not kept in .git/config
      - name: Configure
        run: cmake -B build -DKETTLELAN_BUILD_APP=OFF
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
