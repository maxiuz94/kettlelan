name: Release

# A release is created when a version tag is pushed, e.g.:  git tag v0.1.0 && git push origin v0.1.0
# Running it manually (workflow_dispatch) builds the packages for testing without publishing a release.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_FILE: steamworks_sdk_165.zip

jobs:
  changelog:
    name: CHANGELOG.md entry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check the version entry
        run: |
          VERSION="$(sed -n 's/^project(KettleLAN VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the version in CMakeLists.txt (${VERSION})"; exit 1
          fi
          scripts/release-notes.sh "$VERSION" "$GITHUB_SHA"

  deb:
    name: .deb package (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian12
            image: debian:12
          - distro: ubuntu24.04
            image: ubuntu:24.04
    steps:
      - name: Tools and libraries
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates curl file dpkg-dev gh libgl-dev \
            qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtqml \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-shapes \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Steamworks SDK (official Valve file, verified with SHA256)
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "The SDK_REPO_TOKEN secret is missing"; exit 1; }
          gh release download sdk-165 -R maxiuz94/steamworks-sdk -p "$SDK_FILE" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/cmake/steamworks-sdk.sha256"
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DKETTLELAN_PACKAGE=deb \
                -DKETTLELAN_DEB_DISTRO=${{ matrix.distro }} -DSTEAMWORKS_SDK_ZIP="$RUNNER_TEMP/$SDK_FILE"
          cmake --build build --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cd build && cpack --config CPackConfig.cmake && dpkg-deb -I kettlelan_*.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.distro }}
          path: build/kettlelan_*.deb
          if-no-files-found: error

  appimage:
    name: AppImage
    runs-on: ubuntu-22.04   # an older system, so the AppImage also runs on older distributions
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Qt 6.8 (LTS)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          cache: true
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libgl-dev file
      - name: Steamworks SDK (official Valve file, verified with SHA256)
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "The SDK_REPO_TOKEN secret is missing"; exit 1; }
          gh release download sdk-165 -R maxiuz94/steamworks-sdk -p "$SDK_FILE" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/cmake/steamworks-sdk.sha256"
      - name: Build the AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          CMAKE_EXTRA_ARGS: -DSTEAMWORKS_SDK_ZIP=${{ runner.temp }}/steamworks_sdk_165.zip
        run: packaging/linux/build-appimage.sh build-appimage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: build-appimage/KettleLAN-*-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows package (zip)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Qt 6.8 (LTS)
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Steamworks SDK (official Valve file, verified with SHA256)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SDK_REPO_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "The SDK_REPO_TOKEN secret is missing"; exit 1; }
          gh release download sdk-165 -R maxiuz94/steamworks-sdk -p "$SDK_FILE" -D "$RUNNER_TEMP"
          cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/cmake/steamworks-sdk.sha256"
      - name: Build, test and package
        shell: bash
        run: packaging/windows/build-zip.sh build-windows "$RUNNER_TEMP/$SDK_FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/KettleLAN-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [ changelog, deb, appimage, windows ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # create the release
      id-token: write       # build attestation
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Build attestation (who built the files, from which code and how)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Publish the release (description from CHANGELOG.md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scripts/release-notes.sh "$VERSION" "$GITHUB_SHA" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "KettleLAN ${VERSION}" --notes-file notes.md
